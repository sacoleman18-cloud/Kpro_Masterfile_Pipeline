# ==============================================================================
# ARTIFACT OUTPUT CONTROLS
# ==============================================================================
# Control which artifacts are generated and exported.
# Set to 'yes' to generate, 'no' to skip.
# Skipped artifacts will not be created, exported, registered, or logged.
# ==============================================================================

artifact_outputs:
  # Summary Statistics - Compiled Excel workbook
  # Built from individual CSV files
  summary_stats_excel: yes
  
  # Summary Statistics - Individual CSV files
  # Located in: results/csv/summary_stats/
  csv_detector_summary: yes
  csv_study_summary: yes
  csv_species_summary: yes
  csv_species_accumulation: yes
  csv_hourly_summary_overall: yes
  csv_variance_components: yes
  
  # Summary Statistics - PNG/HTML exports (GT tables)
  png_detector_summary: yes
  png_study_summary: yes
  png_species_summary: yes
  png_hourly_summary_overall: yes
  
  html_detector_summary: yes
  html_study_summary: yes
  html_species_summary: yes
  html_hourly_summary_overall: yes
  
  # Summary Statistics - RDS archive
  # Contains all summary objects
  rds_summary_data: yes
