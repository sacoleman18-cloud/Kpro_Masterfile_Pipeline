# ==============================================================================
# PLOT-SPECIFIC CONFIGURATION
# ==============================================================================
# Control plot generation behavior, visualization settings, and what data
# is included in specific visualizations.
# ==============================================================================

plot_configuration:
  # NoID Species Handling in Plots
  # ────────────────────────────────
  # Determines whether "NoID" (unidentified species) are included or
  # excluded from species composition visualizations.
  # 
  # Options:
  #   - "keep": Include NoID in all species plots (shows separate NoID bar)
  #   - "remove": Exclude NoID from species plots (total heights reflect identified species only)
  #   - "show_separate": Include NoID but on separate subfigure/axis
  #
  # Default: "keep" (maintains data completeness and shows true unidentified fraction)
  # 
  # Note: This setting does NOT affect the NoID proportion plot (plot_noid_proportion),
  # which always shows NoID to help assess data quality.
  noid_handling: "keep"
  
  # Detector Performance Threshold
  # ──────────────────────────────
  # Threshold for highlighting detectors in "Recording Nights" plot.
  # Detectors with fewer nights than this threshold are highlighted in warning color.
  # Set to NULL or negative number to disable highlighting.
  detector_nights_threshold: 20
  
  # Outlier Percentile for Detector Activity
  # ─────────────────────────────────────────
  # Percentile cutoff for identifying and filtering outlier nights
  # in plots showing activity with/without outliers.
  # 
  # Default: 95 (identifies top 5% as outliers)
  outlier_percentile: 95
  
# ==============================================================================
# ARTIFACT OUTPUT CONTROLS
# ==============================================================================
# Control which artifacts are generated and exported.
# Set to 'yes' to generate, 'no' to skip.
# Skipped artifacts will not be created, exported, registered, or logged.
# ==============================================================================

artifact_outputs:
  # Summary Statistics - Compiled Excel workbook
  # Built from individual CSV files
  summary_stats_excel: yes
  
  # Summary Statistics - Individual CSV files
  # Located in: results/csv/summary_stats/
  csv_detector_summary: yes
  csv_study_summary: yes
  csv_species_summary: yes
  csv_species_accumulation: yes
  csv_hourly_summary_overall: yes
  csv_variance_components: yes
  
  # Summary Statistics - PNG/HTML exports (GT tables)
  png_detector_summary: yes
  png_study_summary: yes
  png_species_summary: yes
  png_hourly_summary_overall: yes
  
  html_detector_summary: yes
  html_study_summary: yes
  html_species_summary: yes
  html_hourly_summary_overall: yes
  
  # Summary Statistics - RDS archive
  # Contains all summary objects
  rds_summary_data: yes
