# ------------------------------------------------------------------------------
# SECTION 7: DATASET FINGERPRINTING
# ------------------------------------------------------------------------------
# Cryptographic hashes for complete provenance chain verification.

dataset_fingerprinting:
  
  # Hash algorithm used
  algorithm: "SHA256"
  
  # Source input hashes (for reproducibility verification)
  source_hashes:
    local_raw_files:
      - file: "<FILENAME_1>.csv"
        sha256: "<SHA256_HASH>"
      # ... additional files
    
    external_raw_files:
      - file: "<FILENAME_1>"
        path: "<FULL_PATH>"
        sha256: "<SHA256_HASH>"
      # ... additional files
    
    # Aggregate hash of all inputs (sorted, concatenated)
    combined_input_hash: "<SHA256_HASH>"
  
  # Configuration hash
  config_hash:
    study_parameters_yaml: "<SHA256_HASH>"
  
  # Primary artifact hashes
  artifact_hashes:
    
    # Data artifacts
    checkpoint_01_intro_standardized: "<SHA256_HASH>"
    checkpoint_02_kpro_master: "<SHA256_HASH>"
    cpn_template_original: "<SHA256_HASH>"
    cpn_template_edit: "<SHA256_HASH>"
    cpn_final: "<SHA256_HASH>"
    masterfile_final: "<SHA256_HASH>"
    
    # Summary artifacts
    summary_data_rds: "<SHA256_HASH>"
    summary_xlsx: "<SHA256_HASH>"
    
    # Plot artifacts
    plot_objects_rds: "<SHA256_HASH>"
    
    # Report artifacts
    quarto_report_html: "<SHA256_HASH>"
    release_bundle_zip: "<SHA256_HASH>"
  
  # Provenance chain (ordered list of hash dependencies)
  provenance_chain:
    - step: 1
      name: "raw_inputs"
      hash: "<COMBINED_INPUT_HASH>"
      inputs: null
    
    - step: 2
      name: "intro_standardized"
      hash: "<SHA256_HASH>"
      inputs:
        - "raw_inputs"
        - "study_parameters_yaml"
    
    - step: 3
      name: "kpro_master"
      hash: "<SHA256_HASH>"
      inputs:
        - "intro_standardized"
        - "study_parameters_yaml"
    
    - step: 4
      name: "cpn_template"
      hash: "<SHA256_HASH>"
      inputs:
        - "kpro_master"
    
    - step: 5
      name: "cpn_final"
      hash: "<SHA256_HASH>"
      inputs:
        - "cpn_template"
        - "user_edits"
    
    - step: 6
      name: "summaries"
      hash: "<SHA256_HASH>"
      inputs:
        - "cpn_final"
        - "kpro_master"
    
    - step: 7
      name: "plots"
      hash: "<SHA256_HASH>"
      inputs:
        - "cpn_final"
        - "kpro_master"
    
    - step: 8
      name: "report"
      hash: "<SHA256_HASH>"
      inputs:
        - "summaries"
        - "plots"
        - "study_parameters_yaml"
    
    - step: 9
      name: "release_bundle"
      hash: "<SHA256_HASH>"
      inputs:
        - "cpn_final"
        - "kpro_master"
        - "summaries"
        - "plots"
        - "report"
  
  # Final release fingerprint (hash of all artifact hashes)
  release_fingerprint: "<SHA256_HASH>"

# ------------------------------------------------------------------------------
# SECTION 8: NOTES AND WARNINGS
# ------------------------------------------------------------------------------
# Human-readable notes about anomalies or issues detected during processing.

notes_and_warnings:
  
  # Schema-related notes
  schema_notes:
    - severity: "info"
      code: "MIXED_SCHEMAS_DETECTED"
      message: "Multiple KPro schema versions detected in source data"
      details:
        v1_count: <INTEGER>
        v2_count: <INTEGER>
        v3_count: <INTEGER>
        recommendation: "This is normal for multi-year studies. All schemas harmonized to unified format."
    
    - severity: "warning"
      code: "UNKNOWN_SCHEMA_ROWS"
      message: "Some rows could not be assigned a schema version"
      details:
        row_count: <INTEGER>
        percentage: <FLOAT>
        recommendation: "Review rows with schema_version='unknown' for data quality issues."
  
  # Data quality notes
  data_quality_notes:
    - severity: "info"
      code: "ROWS_FILTERED"
      message: "Rows with N <= 0 or NA were filtered during ingestion"
      details:
        rows_removed: <INTEGER>
        percentage: <FLOAT>
    
    - severity: "info"
      code: "DUPLICATES_REMOVED"
      message: "Duplicate detection events were removed"
      details:
        duplicates_found: <INTEGER>
        criteria: "Same Detector, DateTime_local, auto_id"
  
  # Recording effort notes
  effort_notes:
    - severity: "warning"
      code: "PARTIAL_NIGHTS_DETECTED"
      message: "Some detector-nights have less than expected recording hours"
      details:
        count: <INTEGER>
        percentage: <FLOAT>
        recommendation: "Review CPN template for accuracy. User corrections may be needed."
    
    - severity: "warning"
      code: "NODATA_NIGHTS_DETECTED"
      message: "Some detector-nights have no recorded data"
      details:
        count: <INTEGER>
        detectors_affected: <INTEGER>
        recommendation: "Verify detector deployment records for these nights."
  
  # Species notes
  species_notes:
    - severity: "info"
      code: "HIGH_NOID_PERCENTAGE"
      message: "Significant proportion of calls classified as NoID"
      details:
        percentage: <FLOAT>
        threshold: 20.0
        recommendation: "Consider reviewing classification settings in Kaleidoscope Pro."
  
  # Processing notes
  processing_notes:
    - severity: "info"
      code: "USER_EDITS_APPLIED"
      message: "User corrections were applied to recording hours"
      details:
        nights_edited: <INTEGER>
        total_hours_adjusted: <FLOAT>
    
    - severity: "info"
      code: "TIMEZONE_CONVERSION_APPLIED"
      message: "All timestamps converted to local timezone"
      details:
        timezone: "<TIMEZONE_STRING>"
        utc_offset: "<OFFSET_STRING>"
  
  # System notes
  system_notes:
    - severity: "info"
      code: "PIPELINE_COMPLETED"
      message: "Pipeline completed successfully"
      details:
        total_runtime: "<HH:MM:SS>"
        artifacts_created: <INTEGER>
  
  # Custom user notes (optional)
  user_notes: []
  
  # Summary counts
  summary:
    total_notes: <INTEGER>
    by_severity:
      info: <INTEGER>
      warning: <INTEGER>
      error: <INTEGER>
      critical: <INTEGER>

